name: Build release bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (must match localVersion, for example v0.16.0-beta.6)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install Rust stable
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Helper/carddb_src/Cargo.toml', 'Helper/carddb_src/Cargo.lock', 'Helper/cardimage_src/Cargo.toml', 'Helper/cardimage_src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.toolchain.outputs.cachekey }}-

      - name: Build carddb helper
        shell: pwsh
        run: |
          Push-Location Helper/carddb_src
          cargo build --release --target x86_64-pc-windows-msvc
          Pop-Location
          Copy-Item -LiteralPath "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/carddb.exe" -Destination Helper/carddb.exe -Force

      - name: Build cardimage helper
        shell: pwsh
        run: |
          Push-Location Helper/cardimage_src
          cargo build --release --target x86_64-pc-windows-msvc
          Pop-Location
          Copy-Item -LiteralPath "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/cardimage.exe" -Destination Helper/cardimage.exe -Force

      - name: Fetch RapidOCR engine for the share-expansion OCR flow
        shell: pwsh
        run: |
          $archive = "$env:TEMP\rapidocr.7z"
          Invoke-WebRequest -Uri "https://github.com/hiroi-sora/RapidOCR-json/releases/download/v0.2.0/RapidOCR-json_v0.2.0.7z" -OutFile $archive
          & 7z x $archive -o"$env:TEMP\rapidocr-src" | Out-Null
          New-Item -ItemType Directory rapidocr\RapidOCR-json_v0.2.0\models -Force | Out-Null
          Copy-Item "$env:TEMP\rapidocr-src\RapidOCR-json_v0.2.0\RapidOCR-json.exe" rapidocr\RapidOCR-json_v0.2.0\
          # Only the models and keysets the picker actually uses:
          # det v4 + cls (shared), rec v4 (latin fallback), and the CJK recognizers.
          $keep = @(
            'ch_PP-OCRv3_det_infer.onnx',
            'ch_PP-OCRv4_det_infer.onnx',
            'ch_ppocr_mobile_v2.0_cls_infer.onnx',
            'rec_ch_PP-OCRv4_infer.onnx',
            'dict_chinese.txt',
            'ppocr_keys_v1.txt',
            'rec_japan_PP-OCRv3_infer.onnx',
            'dict_japan.txt',
            'rec_korean_PP-OCRv3_infer.onnx',
            'dict_korean.txt',
            'rec_chinese_cht_PP-OCRv3_infer.onnx',
            'dict_chinese_cht.txt',
            'configs.txt'
          )
          foreach ($f in $keep) {
            Copy-Item "$env:TEMP\rapidocr-src\RapidOCR-json_v0.2.0\models\$f" rapidocr\RapidOCR-json_v0.2.0\models\
          }

      - name: Build release bundle and checksums
        shell: pwsh
        run: ./Build/Package-Release.ps1 -Version $env:RELEASE_VERSION -OutputDirectory ./dist

      - name: Upload bundle for inspection
        uses: actions/upload-artifact@v7
        with:
          name: PTCGPB-${{ env.RELEASE_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_VERSION
          $arguments = @(
            'release', 'create', $tag,
            "dist/PTCGPB-$tag.zip",
            "dist/PTCGPB-$tag.zip.sha256",
            'dist/update-manifest.json',
            '--title', $tag,
            '--verify-tag'
          )
          $notesFile = "Build/release-notes/$tag.md"
          if (Test-Path -LiteralPath $notesFile -PathType Leaf) {
            $arguments += @('--notes-file', $notesFile)
          }
          else {
            $arguments += '--generate-notes'
          }
          if ($tag -match '^v\d+\.\d+\.\d+-') {
            $arguments += '--prerelease'
          }
          & gh @arguments
